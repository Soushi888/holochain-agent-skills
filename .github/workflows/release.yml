name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for a dry run without publishing)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Validate, build assets, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # A hyphen in the version is the semver prerelease marker, so
          # v1.0.0-rc.1 is a release candidate and v1.0.0 is not. A candidate
          # must never become what the releases/latest/download URL hands out,
          # so it is marked a GitHub prerelease, which that URL skips. The npm
          # dist-tag is computed alongside it and is unused while registry
          # publishing is off; it costs one line and keeps the two in step.
          case "${TAG#v}" in
            *-*) PRERELEASE=true;  NPM_TAG=next   ;;
            *)   PRERELEASE=false; NPM_TAG=latest ;;
          esac
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          # Echoed to stdout as well as to GITHUB_OUTPUT, because the outputs
          # are consumed only by the two publishing steps, and those are the
          # steps a workflow_dispatch rehearsal skips. Without this line a dry
          # run proves the branch executes and proves nothing about what it
          # produced, which is the one thing worth rehearsing.
          echo "Resolved: tag=$TAG version=${TAG#v} prerelease=$PRERELEASE npm_tag=$NPM_TAG"

      # Everything below publishes something irreversible, so both gates run
      # first. The version check is the one that matters here: a package whose
      # SKILL.md declares a different version than its tag tells consumers they
      # have something they do not, and nothing inside an installed skill can
      # reveal it.
      - name: Skill validator
        run: sh scripts/validate-skill.sh

      - name: Routing regression guard
        run: sh scripts/eval/run-eval.sh

      - name: Version declarations agree with the tag
        run: sh scripts/check-versions.sh "${{ steps.tag.outputs.tag }}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build the installer binary
        run: bun run build

      - name: Installer smoke test
        # A published installer that cannot install is the one defect this
        # pipeline must never ship. Run it for real, against a scratch project,
        # and assert the file landed.
        run: |
          mkdir -p /tmp/smoke/.claude
          cd /tmp/smoke
          node "$GITHUB_WORKSPACE/bin/install.mjs" install --yes
          test -f /tmp/smoke/.claude/skills/holochain/SKILL.md

      # validate.yml owns this assertion, and validate.yml does not run on tag
      # pushes. Without it here, a `files` regression on the tagged commit
      # reaches npm with nothing having looked inside the tarball. It is the
      # only guard between a consumer and a .claude/skills/holochain/ full of
      # book.toml, docs/ and CI config, so it runs on both paths.
      - name: npm pack contains only the payload
        run: |
          npm pack --dry-run 2>&1 | sed 's/^npm notice *//' \
            | grep -E '^[0-9.]+(B|kB|MB) ' | awk '{print $2}' > /tmp/files.txt
          test -s /tmp/files.txt
          if grep -vE '^(skills/|bin/|README\.md$|LICENSE$|package\.json$)' /tmp/files.txt; then
            echo "the lines above are outside the shipped payload"
            exit 1
          fi
          grep -q '^skills/holochain/SKILL.md$' /tmp/files.txt

      - name: Build release archives
        run: sh scripts/build-release-assets.sh "${{ steps.tag.outputs.version }}"

      - name: Verify archives extract to the documented shape
        # The README tells people to run exactly this. If the archive root is
        # not one directory per skill, that command silently produces a skill
        # directory no agent scans.
        run: |
          mkdir -p /tmp/extract/.claude/skills
          tar -xzf dist/holochain-agent-skills.tar.gz -C /tmp/extract/.claude/skills
          test -f /tmp/extract/.claude/skills/holochain/SKILL.md
          ( cd dist && sha256sum -c SHA256SUMS )
          sh scripts/check-reproducible.sh

      - name: Extract the changelog section for this version
        id: notes
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { capture = 1; next }
            capture && /^## \[/     { exit }
            capture                 { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md

      - name: Publish to npm
        # Off by default. Registry publishing is deferred, not abandoned: the
        # release archive, the Nix flake and the bundled installer cover every
        # documented install path, and the package name would change if the
        # @holochain scope is granted. Re-enable by setting the repository
        # variable NPM_PUBLISH to true, with an NPM_TOKEN whose "Bypass 2FA"
        # setting is on (false by default at creation, and required by an
        # account that enforces 2FA for writes).
        if: github.event_name == 'push' && vars.NPM_PUBLISH == 'true'
        run: npm publish --provenance --access public --tag "${{ steps.tag.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        # npm and GitHub are independent distribution channels, so a registry
        # refusal must not withhold the archives. Every gate above still
        # guards this step; only the publish result is excluded, and the job
        # still reports failure when the publish fails, so a divergence is
        # visible rather than silent.
        if: github.event_name == 'push' && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          body_path: /tmp/release-notes.md
          files: |
            dist/holochain-agent-skills-${{ steps.tag.outputs.version }}.tar.gz
            dist/holochain-agent-skills-${{ steps.tag.outputs.version }}.zip
            dist/holochain-agent-skills.tar.gz
            dist/SHA256SUMS

  sync-discussion-forms:
    # The release above is created with GITHUB_TOKEN, and an event raised by
    # that token starts no workflow run, so the sync workflow's own
    # `on: release` never sees a tagged release. Calling it here is the path.
    # It reads the release list as it is, so it runs even when the release job
    # failed: with no new release it finds nothing to change.
    name: Sync the discussion forms
    needs: release
    if: github.event_name == 'push' && !cancelled()
    uses: ./.github/workflows/sync-discussion-forms.yml
